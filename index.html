<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibrit Bilgi Galerisi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0; padding: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* KART TASARIMI */
        .info-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-10px);
        }

        .media-container {
            width: 100%;
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #2d3436;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        #modal-media {
            width: 100%;
            max-height: 400px;
            background: #000;
        }

        .modal-text {
            padding: 25px;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 20px;
            font-size: 30px; color: #fff;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

<div class="container" id="gallery">
    </div>

<div id="infoModal" class="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div class="modal-content">
        <div id="modal-media-box"></div>
        <div class="modal-text">
            <h2 id="m-title"></h2>
            <p id="m-desc"></p>
        </div>
    </div>
</div>

<script>
    // --- YENİ BİLGİ EKLEME ALANI ---
    // Buraya istediğin kadar yeni madde ekleyebilirsin.
    // 'video' kısmını boş bırakırsan otomatik olarak resim görünür.
    const contents = [
        {
            title: "Energic Atoms Didn't Astonish Us Today!",
            desc: "Do you know a hydrogen atom emits when the electron of the hydrogen transitions from 2nd energy level to 1st energy level?",
            image: "images.png",
            video: "HAu.mp4" // Video var -> Video görünecek
        },
        {
            title: "Tarihi Mimari",
            desc: "1930'ların mimari yapısı ve estetik detayları üzerine bir inceleme.",
            image: "https://picsum.photos/id/1018/600/400",
            video: "" // Video yok -> Resim görünecek
        },
        {
            title: "Kimyasal Reaksiyonlar",
            desc: "Hidrojen atomlarının bağ kurma süreçleri oldukça karmaşıktır.",
            image: "https://picsum.photos/id/1067/600/400",
            video: "" // Video yok -> Resim görünecek
        }
    ];

    const gallery = document.getElementById('gallery');

    // Kartları oluşturma
    contents.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'info-card';
        card.onclick = () => openModal(index);

        let mediaHTML = '';
        if (item.video) {
            mediaHTML = `<video autoplay muted loop><source src="${item.video}" type="video/mp4"></video>`;
        } else {
            mediaHTML = `<img src="${item.image}" alt="${item.title}">`;
        }

        card.innerHTML = `
            <div class="media-container">${mediaHTML}</div>
            <div class="card-info">${item.title}</div>
        `;
        gallery.appendChild(card);
    });

    function openModal(index) {
        const item = contents[index];
        const mediaBox = document.getElementById('modal-media-box');
        
        document.getElementById('m-title').innerText = item.title;
        document.getElementById('m-desc').innerText = item.desc;

        if (item.video) {
            mediaBox.innerHTML = `<video id="modal-media" controls autoplay><source src="${item.video}" type="video/mp4"></video>`;
        } else {
            mediaBox.innerHTML = `<img id="modal-media" src="${item.image}">`;
        }

        document.getElementById('infoModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('modal-media-box').innerHTML = ''; // Videoyu durdur
        document.getElementById('infoModal').style.display = "none";
    }
</script>

</body>
</html>
