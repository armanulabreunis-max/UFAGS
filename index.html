<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hibrit Bilgi Galerisi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            margin: 0; padding: 0; /* Sayfa kenarlarındaki boşluğu banner için sıfırladık */
        }

        /* BANNER TASARIMI */
        .hero-banner {
            width: 100%;
            height: 300px;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://picsum.photos/id/1015/1200/400'); /* Varsayılan görsel */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-banner h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .hero-banner p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* ARAMA KUTUSU TASARIMI */
        .search-container {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
            padding: 15px 25px;
            border-radius: 30px;
            border: 2px solid #ddd;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        #searchInput:focus {
            border-color: #007bff;
            box-shadow: 0 4px 15px rgba(0,123,255,0.2);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        /* KART TASARIMI */
        .info-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-10px);
        }

        .media-container {
            width: 100%;
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #2d3436;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        #modal-media {
            width: 100%;
            max-height: 400px;
            background: #000;
        }

        .modal-text {
            padding: 25px;
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 20px;
            font-size: 30px; color: #fff;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body>

<div class="hero-banner">
    <h1>AI Art & Science Gallery</h1>
    <p>Discover the unseen details of atoms and history.</p>
</div>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="İçeriklerde veya atomlarda ara..." onkeyup="filterGallery()">
</div>

<div class="container" id="gallery"></div>

<div id="infoModal" class="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div class="modal-content">
        <div id="modal-media-box"></div>
        <div class="modal-text">
            <h2 id="m-title"></h2>
            <p id="m-desc"></p>
        </div>
    </div>
</div>

<script>
    const contents = [
        {
            title: "Energic Atoms Didn't Astonish Us Today!",
            desc: "Do you know a hydrogen atom emits ultraviolet light when the electron of the hydrogen transitions from 2nd energy level to 1st energy level?",
            image: "images.png",
            video: "HAu.mp4" 
        },
        {
            title: "Tarihi Mimari",
            desc: "1930'ların mimari yapısı ve estetik detayları üzerine bir inceleme.",
            image: "https://picsum.photos/id/1018/600/400",
            video: "" 
        },
        {
            title: "Kimyasal Reaksiyonlar",
            desc: "Hidrojen atomlarının bağ kurma süreçleri oldukça karmaşıktır.",
            image: "https://picsum.photos/id/1067/600/400",
            video: "" 
        }
    ];

    const gallery = document.getElementById('gallery');

    function displayCards(data) {
        gallery.innerHTML = '';
        data.forEach((item) => {
            const originalIndex = contents.indexOf(item);
            const card = document.createElement('div');
            card.className = 'info-card';
            card.onclick = () => openModal(originalIndex);

            let mediaHTML = item.video 
                ? `<video autoplay muted loop><source src="${item.video}" type="video/mp4"></video>`
                : `<img src="${item.image}" alt="${item.title}">`;

            card.innerHTML = `
                <div class="media-container">${mediaHTML}</div>
                <div class="card-info">${item.title}</div>
            `;
            gallery.appendChild(card);
        });
    }

    function filterGallery() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filteredData = contents.filter(item => 
            item.title.toLowerCase().includes(searchTerm) || 
            item.desc.toLowerCase().includes(searchTerm)
        );
        displayCards(filteredData);
    }

    displayCards(contents);

    function openModal(index) {
        const item = contents[index];
        const mediaBox = document.getElementById('modal-media-box');
        document.getElementById('m-title').innerText = item.title;
        document.getElementById('m-desc').innerText = item.desc;

        mediaBox.innerHTML = item.video 
            ? `<video id="modal-media" controls autoplay><source src="${item.video}" type="video/mp4"></video>`
            : `<img id="modal-media" src="${item.image}">`;

        document.getElementById('infoModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('modal-media-box').innerHTML = '';
        document.getElementById('infoModal').style.display = "none";
    }

    window.onclick = (e) => { if (e.target == document.getElementById('infoModal')) closeModal(); }
</script>

</body>
</html>
